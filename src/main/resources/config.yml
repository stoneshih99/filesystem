# 檔案系統配置
storage:
  # 戰鬥記錄檔案的儲存路徑
  path: "battleRecord"
  
  # 檔案過期設定
  expiration:
    # 預設過期時間（天）
    days: 7
    
    # 是否啟用自動清理
    enableAutoCleanup: true
    
    # 自動清理的執行間隔（小時）
    cleanupIntervalHours: 1

# 執行緒設定
thread:
  # 檔案讀取執行緒池大小
  # 設為 0 或負數時會使用處理器核心數
  fileLoaderPoolSize: 0
  
  # 最小執行緒數
  minThreads: 2
  
  # 最大執行緒數
  # 設為 0 或負數時會使用處理器核心數
  maxThreads: 0
  
  # 執行緒閒置超時時間（秒）
  keepAliveSeconds: 60

# 日誌設定
logging:
  # 日誌檔案路徑
  path: "logs/filesystem.log"
  # 日誌等級 (INFO, WARNING, ERROR)
  level: "INFO" 